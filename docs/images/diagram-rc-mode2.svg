<svg xmlns="http://www.w3.org/2000/svg" width="960" height="587" viewBox="0 0 960 587" role="img" aria-labelledby="title desc"><title id="title">RC transmitter · Mode 2</title><desc id="desc">Stick functions after mapping. Receiver channels are separate from the radio’s menu buttons.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#b2bccb" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.controller-shell{fill:#30343b;stroke:#9ba0ab;stroke-width:1.2}.controller-well{fill:#11141a;stroke:#555d69;stroke-width:1.2}.controller-thumb{fill:#404754;stroke:#949caa}.thumb-inset{fill:#252b34;stroke:#697181}.controller-grip{fill:#222832;stroke:#48505e}.controller-outline{fill:none;stroke:#adb4bf;stroke-width:3;stroke-linecap:round}.controller-detail,.thumb-center{fill:none;stroke:#929aa8;stroke-width:1}.gimbal-guide{stroke:#69717d;stroke-width:.6}.controller-screen{fill:#141921;stroke:#858c99}.screen-lines{stroke:#82928c;stroke-width:1.5}.device-led{fill:#b5d1a3}.controller-glyph{font-size:9px;fill:#f4f4f6;text-anchor:middle}.controller-channel-label{font-size:7px;fill:#b5bac4;text-anchor:middle}.controller-caption{display:none}.keyboard-body{fill:#101319;stroke:#414956}.keyboard-key rect{fill:#1b2028;stroke:#3b4350}.keyboard-key text{text-anchor:middle}.key-letter{font-size:12px;fill:#7e8795}.key-function{font-size:7.5px;fill:#e4e9f0}.mapped .key-letter{fill:#fff}.mapped.flight rect{fill:#273e49;stroke:#7fa7b9}.mapped.power rect{fill:#4b3e29;stroke:#d1b479}.mapped.session rect{fill:#354336;stroke:#8ab193}.mapped.view rect{fill:#3f364c;stroke:#ac97c6}</style><rect width="960" height="587" rx="16" fill="#111419"/><text x="32" y="42" font-size="26" fill="#f1f2f5" text-anchor="start">RC transmitter · Mode 2</text><text x="32" y="69" font-size="14" fill="#a1a5b0" text-anchor="start">Stick functions after mapping. Receiver channels are separate from the radio’s menu buttons.</text><g class="controller" transform="translate(240 135) scale(1.2)"><g class="transmitter-face">
