<svg xmlns="http://www.w3.org/2000/svg" width="960" height="472" viewBox="0 0 960 472" role="img" aria-labelledby="title desc"><title id="title">Components determine balance</title><desc id="desc">Each installed part contributes mass, center of gravity and rotational inertia.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#b2bccb" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.controller-shell{fill:#30343b;stroke:#9ba0ab;stroke-width:1.2}.controller-well{fill:#11141a;stroke:#555d69;stroke-width:1.2}.controller-thumb{fill:#404754;stroke:#949caa}.thumb-inset{fill:#252b34;stroke:#697181}.controller-grip{fill:#222832;stroke:#48505e}.controller-outline{fill:none;stroke:#adb4bf;stroke-width:3;stroke-linecap:round}.controller-detail,.thumb-center{fill:none;stroke:#929aa8;stroke-width:1}.gimbal-guide{stroke:#69717d;stroke-width:.6}.controller-screen{fill:#141921;stroke:#858c99}.screen-lines{stroke:#82928c;stroke-width:1.5}.device-led{fill:#b5d1a3}.controller-glyph{font-size:9px;fill:#f4f4f6;text-anchor:middle}.controller-channel-label{font-size:7px;fill:#b5bac4;text-anchor:middle}.controller-caption{display:none}.keyboard-body{fill:#101319;stroke:#414956}.keyboard-key rect{fill:#1b2028;stroke:#3b4350}.keyboard-key text{text-anchor:middle}.key-letter{font-size:12px;fill:#7e8795}.key-function{font-size:7.5px;fill:#e4e9f0}.mapped .key-letter{fill:#fff}.mapped.flight rect{fill:#273e49;stroke:#7fa7b9}.mapped.power rect{fill:#4b3e29;stroke:#d1b479}.mapped.session rect{fill:#354336;stroke:#8ab193}.mapped.view rect{fill:#3f364c;stroke:#ac97c6}</style><rect width="960" height="472" rx="16" fill="#111419"/><text x="32" y="42" font-size="26" fill="#f1f2f5" text-anchor="start">Components determine balance</text><text x="32" y="69" font-size="14" fill="#a1a5b0" text-anchor="start">Each installed part contributes mass, center of gravity and rotational inertia.</text><text x="50" y="148" font-size="16" fill="#87c8d5" text-anchor="start">NOSE / FORWARD</text><text x="888" y="148" font-size="16" fill="#a1a5b0" text-anchor="end">TAIL</text><path d="M54 257Q68 210 185 205H659L829 235H908V266H184Z" fill="#292f38" stroke="#9ca5b4" stroke-width="2"/><path d="M386 205 526 173H580V287H386Z" fill="#363e48" stroke="#9ca5b4"/><rect x="166" y="224" width="112" height="33" rx="4" fill="#3e483b" stroke="#a5c6a7"/><text x="222" y="246" font-size="14" fill="#a5c6a7" text-anchor="middle">BATTERY</text><circle cx="401" cy="253" r="5" fill="#eac275"/><path d="M401 181v127M370 253h62" fill="none" stroke="#eac275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="408" y="181" font-size="22" fill="#eac275" text-anchor="start">CG</text><path d="M268 339H137" fill="none" stroke="#a5c6a7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="301" y="345" font-size="19" fill="#f1f2f5" text-anchor="start">Move battery forward → CG moves toward the nose.</text><text x="32" y="398" font-size="18" fill="#eac275" text-anchor="start">Mass × position matters. Do not add the battery weight twice.</text><text x="32" y="428" font-size="17" fill="#a1a5b0" text-anchor="start">CG = sum of (part mass × part position) ÷ total mass</text><text x="32" y="454" font-size="11" fill="#737c89" text-anchor="start">RCFORGE  /  VISUAL FIELD GUIDE</text></svg>
