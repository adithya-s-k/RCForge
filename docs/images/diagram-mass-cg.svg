<svg xmlns="http://www.w3.org/2000/svg" width="960" height="674" viewBox="0 0 960 674" role="img" aria-labelledby="title desc"><title id="title">Balance comes from the installed parts</title><desc id="desc">Illustrative layout; the example uses the 1,287 g VTOL mass ledger and a 190 g battery.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#b2bccb" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.controller-shell{fill:#30343b;stroke:#9ba0ab;stroke-width:1.2}.controller-well{fill:#11141a;stroke:#555d69;stroke-width:1.2}.controller-thumb{fill:#404754;stroke:#949caa}.thumb-inset{fill:#252b34;stroke:#697181}.controller-grip{fill:#222832;stroke:#48505e}.controller-outline{fill:none;stroke:#adb4bf;stroke-width:3;stroke-linecap:round}.controller-detail,.thumb-center{fill:none;stroke:#929aa8;stroke-width:1}.gimbal-guide{stroke:#69717d;stroke-width:.6}.controller-screen{fill:#141921;stroke:#858c99}.screen-lines{stroke:#82928c;stroke-width:1.5}.device-led{fill:#b5d1a3}.controller-glyph{font-size:9px;fill:#f4f4f6;text-anchor:middle}.controller-channel-label{font-size:7px;fill:#b5bac4;text-anchor:middle}.controller-caption{display:none}.keyboard-body{fill:#101319;stroke:#414956}.keyboard-key rect{fill:#1b2028;stroke:#3b4350}.keyboard-key text{text-anchor:middle}.key-letter{font-size:12px;fill:#7e8795}.key-function{font-size:7.5px;fill:#e4e9f0}.mapped .key-letter{fill:#fff}.mapped.flight rect{fill:#273e49;stroke:#7fa7b9}.mapped.power rect{fill:#4b3e29;stroke:#d1b479}.mapped.session rect{fill:#354336;stroke:#8ab193}.mapped.view rect{fill:#3f364c;stroke:#ac97c6}</style><rect width="960" height="674" rx="16" fill="#111419"/><text x="32" y="42" font-size="26" fill="#f1f2f5" text-anchor="start">Balance comes from the installed parts</text><text x="32" y="69" font-size="14" fill="#a1a5b0" text-anchor="start">Illustrative layout; the example uses the 1,287 g VTOL mass ledger and a 190 g battery.</text><rect x="24" y="102" width="912" height="392" rx="8" fill="#171c21" stroke="#303942"/><text x="45" y="130" font-size="12" fill="#a1a5b0" text-anchor="start">TOP VIEW / NOSE LEFT</text><path d="M92 310H875" fill="none" stroke="#47525b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><g stroke="#a0abb2" stroke-width="1.5"><path d="M91 310Q124 278 180 281L406 280 778 305 864 303v14l-86-2-372 26-226-2Q124 342 91 310Z" fill="#303a40"/><path d="M369 154h62l28 118v76l-28 119h-62l-13-119v-76Z" fill="#536068"/><path d="M770 245h29l32 57v16l-32 59h-29v-59Z" fill="#46545d"/><path d="M395 155v311M785 247v129" stroke="#788790"/><path d="m189 283 100-2-17 58-83-2Z" fill="#151f24"/></g><rect x="149" y="294" width="88" height="32" rx="4" fill="#466152" stroke="#a5c6a7"/><text x="193" y="315" font-size="11" fill="#d6e7d8" text-anchor="middle">BATTERY</text><rect x="268" y="294" width="88" height="32" rx="4" fill="none" stroke="#a5c6a7"/><path d="M323 361H191" fill="none" stroke="#a5c6a7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="250" y="386" font-size="14" fill="#a5c6a7" text-anchor="middle">Move the battery forward</text><path d="M404 237v150M375 310h57" fill="none" stroke="#eac275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="404" cy="310" r="5" fill="#eac275"/><text x="414" y="237" font-size="18" fill="#eac275" text-anchor="start">CG</text><path d="M420 212h-27" fill="none" stroke="#eac275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="510" y="193" font-size="19" fill="#f1f2f5" text-anchor="start">The whole aircraft responds</text><text x="510" y="219" font-size="14" fill="#a1a5b0" text-anchor="start">A heavier or more distant part has more influence.</text><path d="M380 414v27m-2-14h-70" fill="none" stroke="#a1a5b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="448" font-size="12" fill="#a1a5b0" text-anchor="middle">Wing leading edge</text><rect x="32" y="514" width="288" height="82" rx="7" fill="#1b2126" stroke="#303941"/><svg x="47" y="536" width="34" height="34" viewBox="0 0 24 24" color="#b8c3cb" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="17" height="12" rx="2"/><path d="M20 10h2v4h-2M8 9v6M5 12h6M14 12h3"/></svg><text x="94" y="545" font-size="16" fill="#f1f2f5" text-anchor="start">190 g battery</text><text x="94" y="569" font-size="12" fill="#a1a5b0" text-anchor="start">Move 50 mm forward</text><rect x="336" y="514" width="288" height="82" rx="7" fill="#1b2126" stroke="#303941"/><svg x="351" y="536" width="34" height="34" viewBox="0 0 24 24" color="#b8c3cb" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-6 9 6v7l-9 5-9-5Zm0 0 9 5 9-5M12 14v7M7 6l10 6"/></svg><text x="398" y="545" font-size="16" fill="#f1f2f5" text-anchor="start">1,287 g aircraft</text><text x="398" y="569" font-size="12" fill="#a1a5b0" text-anchor="start">Total mass stays constant</text><rect x="640" y="514" width="288" height="82" rx="7" fill="#1b2126" stroke="#303941"/><svg x="655" y="536" width="34" height="34" viewBox="0 0 24 24" color="#b8c3cb" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></svg><text x="702" y="545" font-size="16" fill="#f1f2f5" text-anchor="start">7.4 mm CG shift</text><text x="702" y="569" font-size="12" fill="#a1a5b0" text-anchor="start">Calculated toward the nose</text><text x="32" y="626" font-size="15" fill="#eac275" text-anchor="start">CG shift = moved mass ÷ total mass × movement. Count each physical part once.</text><text x="32" y="656" font-size="11" fill="#737c89" text-anchor="start">RCFORGE  /  VISUAL FIELD GUIDE</text></svg>
