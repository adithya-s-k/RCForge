<svg xmlns="http://www.w3.org/2000/svg" width="960" height="553" viewBox="0 0 960 553" role="img" aria-labelledby="title desc"><title id="title">Keyboard flight controls</title><desc id="desc">Highlighted keys fly the aircraft. Click the flight view before using shortcuts.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#536574" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.controller-shell{fill:#30343b;stroke:#9ba0ab;stroke-width:1.2}.controller-well{fill:#11141a;stroke:#555d69;stroke-width:1.2}.controller-thumb{fill:#404754;stroke:#949caa}.thumb-inset{fill:#252b34;stroke:#697181}.controller-grip{fill:#222832;stroke:#48505e}.controller-outline{fill:none;stroke:#adb4bf;stroke-width:3;stroke-linecap:round}.controller-detail,.thumb-center{fill:none;stroke:#929aa8;stroke-width:1}.gimbal-guide{stroke:#69717d;stroke-width:.6}.controller-screen{fill:#141921;stroke:#858c99}.screen-lines{stroke:#82928c;stroke-width:1.5}.device-led{fill:#b5d1a3}.controller-glyph{font-size:9px;fill:#f4f4f6;text-anchor:middle}.controller-channel-label{font-size:7px;fill:#b5bac4;text-anchor:middle}.controller-caption{display:none}.keyboard-body{fill:#101319;stroke:#414956}.keyboard-key rect{fill:#1b2028;stroke:#3b4350}.keyboard-key text{text-anchor:middle}.key-letter{font-size:12px;fill:#7e8795}.key-function{font-size:7.5px;fill:#e4e9f0}.mapped .key-letter{fill:#fff}.mapped.flight rect{fill:#273e49;stroke:#7fa7b9}.mapped.power rect{fill:#4b3e29;stroke:#d1b479}.mapped.session rect{fill:#354336;stroke:#8ab193}.mapped.view rect{fill:#3f364c;stroke:#ac97c6}</style><rect width="960" height="553" rx="16" fill="#f7f9fb"/><text x="32" y="42" font-size="26" fill="#263442" text-anchor="start">Keyboard flight controls</text><text x="32" y="69" font-size="14" fill="#526273" text-anchor="start">Highlighted keys fly the aircraft. Click the flight view before using shortcuts.</text><g transform="translate(30 116) scale(1.235)"><rect class="keyboard-body" x="2" y="2" width="724" height="246" rx="12"/><g class="keyboard-key " data-key-code="Escape"><title>Esc</title><rect x="16" y="16" width="40" height="40" rx="5"/><text class="key-letter" x="36" y="33">Esc</text></g><g class="keyboard-key " data-key-code="Digit1"><title>1</title><rect x="60" y="16" width="40" height="40" rx="5"/><text class="key-letter" x="80" y="33">1</text></g><g class="keyboard-key " data-key-code="Digit2"><title>2</title><rect x="104" y="16" width="40" height="40" rx="5"/><text class="key-letter" x="124" y="33">2</text></g><g class="keyboard-key " data-key-code="Digit3"><title>3</title><rect x="148" y="16" width="40" height="40" rx="5"/><text class="key-letter" x="168" y="33">3</text></g><g class="keyboard-key " data-key-code="Digit4"><title>4</title><rect x="192" y="16" width="40" height="40" rx="5"/><text class="key-letter" x="212" y="33">4</text></g><g class="keyboard-key " data-key-code="Digit5"><title>5</title><rect x="236" y="16" width="40" height="40" rx="5"/><text class="key-letter" x="256" y="33">5</text></g><g class="keyboard-key " data-key-code="Digit6"><title>6</title><rect x="280" y="16" width="40" height="40" rx="5"/><text class="key-letter" x="300" y="33">6</text></g><g class="keyboard-key " data-key-code="Digit7"><title>7</title><rect x="324" y="16" width="40" height="40" rx="5"/><text class="key-letter" x="344" y="33">7</text></g><g class="keyboard-key " data-key-code="Digit8"><title>8</title><rect x="368" y="16" width="40" height="40" rx="5"/><text class="key-letter" x="388" y="33">8</text></g><g class="keyboard-key " data-key-code="Digit9"><title>9</title><rect x="412" y="16" width="40" height="40" rx="5"/><text class="key-letter" x="432" y="33">9</text></g><g class="keyboard-key " data-key-code="Digit0"><title>0</title><rect x="456" y="16" width="40" height="40" rx="5"/><text class="key-letter" x="476" y="33">0</text></g><g class="keyboard-key " data-key-code="Backspace"><title>Backspace</title><rect x="500" y="16" width="76" height="40" rx="5"/><text class="key-letter" x="538" y="33">Backspace</text></g><g class="keyboard-key " data-key-code="Tab"><title>Tab</title><rect x="16" y="60" width="52" height="40" rx="5"/><text class="key-letter" x="42" y="77">Tab</text></g><g class="keyboard-key mapped flight" data-key-code="KeyQ"><title>Q: Yaw L</title><rect x="72" y="60" width="40" height="40" rx="5"/><text class="key-letter" x="92" y="77">Q</text><text class="key-function" x="92" y="91">Yaw L</text></g><g class="keyboard-key mapped flight" data-key-code="KeyW"><title>W: Pitch ↓</title><rect x="116" y="60" width="40" height="40" rx="5"/><text class="key-letter" x="136" y="77">W</text><text class="key-function" x="136" y="91">Pitch ↓</text></g><g class="keyboard-key mapped flight" data-key-code="KeyE"><title>E: Yaw R</title><rect x="160" y="60" width="40" height="40" rx="5"/><text class="key-letter" x="180" y="77">E</text><text class="key-function" x="180" y="91">Yaw R</text></g><g class="keyboard-key mapped session" data-key-code="KeyR"><title>R: Restart</title><rect x="204" y="60" width="40" height="40" rx="5"/><text class="key-letter" x="224" y="77">R</text><text class="key-function" x="224" y="91">Restart</text></g><g class="keyboard-key mapped flight" data-key-code="KeyT"><title>T: VTOL mode</title><rect x="248" y="60" width="40" height="40" rx="5"/><text class="key-letter" x="268" y="77">T</text><text class="key-function" x="268" y="91">VTOL mode</text></g><g class="keyboard-key " data-key-code="KeyY"><title>Y</title><rect x="292" y="60" width="40" height="40" rx="5"/><text class="key-letter" x="312" y="77">Y</text></g><g class="keyboard-key " data-key-code="KeyU"><title>U</title><rect x="336" y="60" width="40" height="40" rx="5"/><text class="key-letter" x="356" y="77">U</text></g><g class="keyboard-key mapped view" data-key-code="KeyI"><title>I: Walk</title><rect x="380" y="60" width="40" height="40" rx="5"/><text class="key-letter" x="400" y="77">I</text><text class="key-function" x="400" y="91">Walk</text></g><g class="keyboard-key " data-key-code="KeyO"><title>O</title><rect x="424" y="60" width="40" height="40" rx="5"/><text class="key-letter" x="444" y="77">O</text></g><g class="keyboard-key mapped session" data-key-code="KeyP"><title>P: Pause</title><rect x="468" y="60" width="40" height="40" rx="5"/><text class="key-letter" x="488" y="77">P</text><text class="key-function" x="488" y="91">Pause</text></g><g class="keyboard-key " data-key-code="BracketLeft"><title>[</title><rect x="512" y="60" width="30" height="40" rx="5"/><text class="key-letter" x="527" y="77">[</text></g><g class="keyboard-key " data-key-code="BracketRight"><title>]</title><rect x="546" y="60" width="30" height="40" rx="5"/><text class="key-letter" x="561" y="77">]</text></g><g class="keyboard-key " data-key-code="CapsLock"><title>Caps</title><rect x="16" y="104" width="64" height="40" rx="5"/><text class="key-letter" x="48" y="121">Caps</text></g><g class="keyboard-key mapped flight" data-key-code="KeyA"><title>A: Roll L</title><rect x="84" y="104" width="40" height="40" rx="5"/><text class="key-letter" x="104" y="121">A</text><text class="key-function" x="104" y="135">Roll L</text></g><g class="keyboard-key mapped flight" data-key-code="KeyS"><title>S: Pitch ↑</title><rect x="128" y="104" width="40" height="40" rx="5"/><text class="key-letter" x="148" y="121">S</text><text class="key-function" x="148" y="135">Pitch ↑</text></g><g class="keyboard-key mapped flight" data-key-code="KeyD"><title>D: Roll R</title><rect x="172" y="104" width="40" height="40" rx="5"/><text class="key-letter" x="192" y="121">D</text><text class="key-function" x="192" y="135">Roll R</text></g><g class="keyboard-key mapped view" data-key-code="KeyF"><title>F: Locate</title><rect x="216" y="104" width="40" height="40" rx="5"/><text class="key-letter" x="236" y="121">F</text><text class="key-function" x="236" y="135">Locate</text></g><g class="keyboard-key " data-key-code="KeyG"><title>G</title><rect x="260" y="104" width="40" height="40" rx="5"/><text class="key-letter" x="280" y="121">G</text></g><g class="keyboard-key mapped power" data-key-code="KeyH"><title>H: Hover 50%</title><rect x="304" y="104" width="40" height="40" rx="5"/><text class="key-letter" x="324" y="121">H</text><text class="key-function" x="324" y="135">Hover 50%</text></g><g class="keyboard-key mapped view" data-key-code="KeyJ"><title>J: Walk</title><rect x="348" y="104" width="40" height="40" rx="5"/><text class="key-letter" x="368" y="121">J</text><text class="key-function" x="368" y="135">Walk</text></g><g class="keyboard-key mapped view" data-key-code="KeyK"><title>K: Walk</title><rect x="392" y="104" width="40" height="40" rx="5"/><text class="key-letter" x="412" y="121">K</text><text class="key-function" x="412" y="135">Walk</text></g><g class="keyboard-key mapped view" data-key-code="KeyL"><title>L: Walk</title><rect x="436" y="104" width="40" height="40" rx="5"/><text class="key-letter" x="456" y="121">L</text><text class="key-function" x="456" y="135">Walk</text></g><g class="keyboard-key mapped session" data-key-code="Enter"><title>Enter: Start</title><rect x="480" y="104" width="96" height="40" rx="5"/><text class="key-letter" x="528" y="121">Enter</text><text class="key-function" x="528" y="135">Start</text></g><g class="keyboard-key mapped power" data-key-code="ShiftLeft"><title>Shift: Power −</title><rect x="16" y="148" width="86" height="40" rx="5"/><text class="key-letter" x="59" y="165">Shift</text><text class="key-function" x="59" y="179">Power −</text></g><g class="keyboard-key " data-key-code="KeyZ"><title>Z</title><rect x="106" y="148" width="40" height="40" rx="5"/><text class="key-letter" x="126" y="165">Z</text></g><g class="keyboard-key mapped power" data-key-code="KeyX"><title>X: Cut power</title><rect x="150" y="148" width="40" height="40" rx="5"/><text class="key-letter" x="170" y="165">X</text><text class="key-function" x="170" y="179">Cut power</text></g><g class="keyboard-key mapped flight" data-key-code="KeyC"><title>C: Rates</title><rect x="194" y="148" width="40" height="40" rx="5"/><text class="key-letter" x="214" y="165">C</text><text class="key-function" x="214" y="179">Rates</text></g><g class="keyboard-key mapped view" data-key-code="KeyV"><title>V: Camera</title><rect x="238" y="148" width="40" height="40" rx="5"/><text class="key-letter" x="258" y="165">V</text><text class="key-function" x="258" y="179">Camera</text></g><g class="keyboard-key mapped flight" data-key-code="KeyB"><title>B: VTOL assist</title><rect x="282" y="148" width="40" height="40" rx="5"/><text class="key-letter" x="302" y="165">B</text><text class="key-function" x="302" y="179">VTOL assist</text></g><g class="keyboard-key " data-key-code="KeyN"><title>N</title><rect x="326" y="148" width="40" height="40" rx="5"/><text class="key-letter" x="346" y="165">N</text></g><g class="keyboard-key " data-key-code="KeyM"><title>M</title><rect x="370" y="148" width="40" height="40" rx="5"/><text class="key-letter" x="390" y="165">M</text></g><g class="keyboard-key mapped power" data-key-code="ShiftRight"><title>Shift: Power −</title><rect x="414" y="148" width="162" height="40" rx="5"/><text class="key-letter" x="495" y="165">Shift</text><text class="key-function" x="495" y="179">Power −</text></g><g class="keyboard-key " data-key-code="ControlLeft"><title>Ctrl</title><rect x="16" y="192" width="60" height="40" rx="5"/><text class="key-letter" x="46" y="209">Ctrl</text></g><g class="keyboard-key " data-key-code="AltLeft"><title>Alt</title><rect x="80" y="192" width="56" height="40" rx="5"/><text class="key-letter" x="108" y="209">Alt</text></g><g class="keyboard-key mapped power" data-key-code="Space"><title>Space: Power +</title><rect x="140" y="192" width="312" height="40" rx="5"/><text class="key-letter" x="296" y="209">Space</text><text class="key-function" x="296" y="223">Power +</text></g><g class="keyboard-key " data-key-code="AltRight"><title>Alt</title><rect x="456" y="192" width="56" height="40" rx="5"/><text class="key-letter" x="484" y="209">Alt</text></g><g class="keyboard-key " data-key-code="ControlRight"><title>Ctrl</title><rect x="516" y="192" width="60" height="40" rx="5"/><text class="key-letter" x="546" y="209">Ctrl</text></g><g class="keyboard-key mapped flight" data-key-code="ArrowUp"><title>↑: Pitch ↓</title><rect x="628" y="148" width="40" height="40" rx="5"/><text class="key-letter" x="648" y="165">↑</text><text class="key-function" x="648" y="179">Pitch ↓</text></g><g class="keyboard-key mapped flight" data-key-code="ArrowLeft"><title>←: Roll L</title><rect x="584" y="192" width="40" height="40" rx="5"/><text class="key-letter" x="604" y="209">←</text><text class="key-function" x="604" y="223">Roll L</text></g><g class="keyboard-key mapped flight" data-key-code="ArrowDown"><title>↓: Pitch ↑</title><rect x="628" y="192" width="40" height="40" rx="5"/><text class="key-letter" x="648" y="209">↓</text><text class="key-function" x="648" y="223">Pitch ↑</text></g><g class="keyboard-key mapped flight" data-key-code="ArrowRight"><title>→: Roll R</title><rect x="672" y="192" width="40" height="40" rx="5"/><text class="key-letter" x="692" y="209">→</text><text class="key-function" x="692" y="223">Roll R</text></g></g><rect x="32" y="453" width="78" height="30" rx="7" fill="#edf1f5" stroke="#236c7d"/><text x="44" y="474" font-size="14" fill="#236c7d" text-anchor="start">FLIGHT</text><rect x="182" y="453" width="69" height="30" rx="7" fill="#edf1f5" stroke="#8b5915"/><text x="194" y="474" font-size="14" fill="#8b5915" text-anchor="start">POWER</text><rect x="325" y="453" width="87" height="30" rx="7" fill="#edf1f5" stroke="#346a48"/><text x="337" y="474" font-size="14" fill="#346a48" text-anchor="start">SESSION</text><rect x="489" y="453" width="123" height="30" rx="7" fill="#edf1f5" stroke="#72529b"/><text x="501" y="474" font-size="14" fill="#72529b" text-anchor="start">VIEW / WALK</text><text x="32" y="516" font-size="18" fill="#263442" text-anchor="start">Space raises power · Shift lowers power · Releasing holds power · X cuts power</text><text x="32" y="535" font-size="11" fill="#647283" text-anchor="start">RCFORGE  /  VISUAL FIELD GUIDE</text><style>.keyboard-body{fill:#e5ebf0;stroke:#8c9bab}.keyboard-key rect{fill:#f8fafb;stroke:#c2cbd5}.key-letter{fill:#607182}.key-function,.mapped .key-letter{fill:#263442}.mapped.flight rect{fill:#dbeaf0;stroke:#547f91}.mapped.power rect{fill:#f6ecd8;stroke:#987032}.mapped.session rect{fill:#e2ecdf;stroke:#64865e}.mapped.view rect{fill:#ebe4f3;stroke:#8b74a4}</style></svg>
