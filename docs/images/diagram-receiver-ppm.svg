<svg xmlns="http://www.w3.org/2000/svg" width="960" height="658" viewBox="0 0 960 658" role="img" aria-labelledby="title desc"><title id="title">Receiver PPM → Arduino</title><desc id="desc">Logical wiring, not a connector-face pinout. Read labels on your exact board and receiver.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#b2bccb" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.controller-shell{fill:#30343b;stroke:#9ba0ab;stroke-width:1.2}.controller-well{fill:#11141a;stroke:#555d69;stroke-width:1.2}.controller-thumb{fill:#404754;stroke:#949caa}.thumb-inset{fill:#252b34;stroke:#697181}.controller-grip{fill:#222832;stroke:#48505e}.controller-outline{fill:none;stroke:#adb4bf;stroke-width:3;stroke-linecap:round}.controller-detail,.thumb-center{fill:none;stroke:#929aa8;stroke-width:1}.gimbal-guide{stroke:#69717d;stroke-width:.6}.controller-screen{fill:#141921;stroke:#858c99}.screen-lines{stroke:#82928c;stroke-width:1.5}.device-led{fill:#b5d1a3}.controller-glyph{font-size:9px;fill:#f4f4f6;text-anchor:middle}.controller-channel-label{font-size:7px;fill:#b5bac4;text-anchor:middle}.controller-caption{display:none}.keyboard-body{fill:#101319;stroke:#414956}.keyboard-key rect{fill:#1b2028;stroke:#3b4350}.keyboard-key text{text-anchor:middle}.key-letter{font-size:12px;fill:#7e8795}.key-function{font-size:7.5px;fill:#e4e9f0}.mapped .key-letter{fill:#fff}.mapped.flight rect{fill:#273e49;stroke:#7fa7b9}.mapped.power rect{fill:#4b3e29;stroke:#d1b479}.mapped.session rect{fill:#354336;stroke:#8ab193}.mapped.view rect{fill:#3f364c;stroke:#ac97c6}</style><rect width="960" height="658" rx="16" fill="#111419"/><text x="32" y="42" font-size="26" fill="#f1f2f5" text-anchor="start">Receiver PPM → Arduino</text><text x="32" y="69" font-size="14" fill="#a1a5b0" text-anchor="start">Logical wiring, not a connector-face pinout. Read labels on your exact board and receiver.</text><rect x="32" y="96" width="186" height="30" rx="7" fill="#171b21" stroke="#eac275"/><text x="44" y="117" font-size="14" fill="#eac275" text-anchor="start">RCF_INPUT_MODE = 1</text><text x="928" y="118" font-size="14" fill="#87c8d5" text-anchor="end">CLASSIC ATmega328P UNO / NANO</text><rect x="32" y="155" width="260" height="248" rx="12" fill="#191c22" stroke="#3b404b"/><g transform="translate(215 277) scale(0.43)"><path d="M40 24 25 8 7 8m74 16L91 8h21" fill="none" stroke="#9aa6af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="24" width="76" height="72" rx="7" fill="#252c31" stroke="#9aa6af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="31" y="33" width="40" height="32" rx="2" fill="#182421"/><path d="M36 40h25m-25 7h19m-19 7h25" stroke="#829e8e"/><circle cx="39" cy="78" r="3" fill="#a9c991"/><rect x="79" y="35" width="12" height="4" fill="#b6a164"/><rect x="79" y="43" width="12" height="4" fill="#b6a164"/><rect x="79" y="51" width="12" height="4" fill="#b6a164"/><rect x="79" y="59" width="12" height="4" fill="#b6a164"/><rect x="79" y="67" width="12" height="4" fill="#b6a164"/><rect x="79" y="75" width="12" height="4" fill="#b6a164"/></g><text x="52" y="187" font-size="19" fill="#f1f2f5" text-anchor="start">Receiver · PPM mode</text><text x="52" y="214" font-size="14" fill="#a1a5b0" text-anchor="start">FS-iA6B example · check labels</text><rect x="662" y="155" width="266" height="248" rx="12" fill="#191c22" stroke="#3b404b"/><g transform="translate(860 163) scale(0.43)"><path d="M17 19h77l9 9v76H17Z" fill="#243c3c" stroke="#9aa6af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="33" width="25" height="25" rx="2" fill="#8c969b"/><rect x="10" y="39" width="15" height="13" fill="#222a30"/><rect x="20" y="74" width="22" height="16" rx="3" fill="#161d21"/><rect x="52" y="50" width="24" height="30" rx="2" fill="#151c20"/><rect x="29" y="26" width="4" height="6" fill="#b8a15c"/><rect x="29" y="93" width="4" height="6" fill="#b8a15c"/><rect x="37" y="26" width="4" height="6" fill="#b8a15c"/><rect x="37" y="93" width="4" height="6" fill="#b8a15c"/><rect x="45" y="26" width="4" height="6" fill="#b8a15c"/><rect x="45" y="93" width="4" height="6" fill="#b8a15c"/><rect x="53" y="26" width="4" height="6" fill="#b8a15c"/><rect x="53" y="93" width="4" height="6" fill="#b8a15c"/><rect x="61" y="26" width="4" height="6" fill="#b8a15c"/><rect x="61" y="93" width="4" height="6" fill="#b8a15c"/><rect x="69" y="26" width="4" height="6" fill="#b8a15c"/><rect x="69" y="93" width="4" height="6" fill="#b8a15c"/><rect x="77" y="26" width="4" height="6" fill="#b8a15c"/><rect x="77" y="93" width="4" height="6" fill="#b8a15c"/><rect x="85" y="26" width="4" height="6" fill="#b8a15c"/><rect x="85" y="93" width="4" height="6" fill="#b8a15c"/><circle cx="90" cy="79" r="3" fill="#bdcf8a"/><path d="M45 45h39M45 84h40" stroke="#477063"/><circle cx="94" cy="39" r="3" fill="#121b20"/><text x="62" y="42" fill="#baccc8" text-anchor="middle" font-size="8">UNO / NANO</text></g><text x="682" y="187" font-size="22" fill="#f1f2f5" text-anchor="start">Arduino</text><text x="682" y="214" font-size="14" fill="#a1a5b0" text-anchor="start">USB-powered board</text><text x="52" y="263" font-size="20" fill="#eac275" text-anchor="start">PPM / CH1 S</text><path d="M292 258H355" fill="none" stroke="#eac275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="355" y="244" width="82" height="28" rx="2" fill="#332c21" stroke="#eac275"/><text x="396" y="234" font-size="16" fill="#eac275" text-anchor="middle">1 kΩ</text><path d="M437 258H660" fill="none" stroke="#eac275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="682" y="263" font-size="22" fill="#eac275" text-anchor="start">D2</text><circle cx="510" cy="258" r="5" fill="#eac275"/><path d="M510 258v29" fill="none" stroke="#eac275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="497" y="287" width="26" height="32" rx="2" fill="#332c21" stroke="#eac275"/><text x="537" y="308" font-size="16" fill="#eac275" text-anchor="start">47 kΩ</text><path d="M510 319v21" fill="none" stroke="#b2bccb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="345" font-size="20" fill="#b2bccb" text-anchor="start">−  GND</text><path d="M292 340H660" fill="none" stroke="#b2bccb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="510" cy="340" r="5" fill="#b2bccb"/><text x="682" y="345" font-size="22" fill="#b2bccb" text-anchor="start">GND</text><text x="52" y="382" font-size="20" fill="#ed938b" text-anchor="start">+  Supply</text><path d="M662 377H294" fill="none" stroke="#ed938b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="682" y="382" font-size="22" fill="#ed938b" text-anchor="start">5V *</text><path d="M795 403v49" fill="none" stroke="#87c8d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="662" y="468" width="266" height="86" rx="12" fill="#191c22" stroke="#3b404b"/><text x="795" y="502" font-size="21" fill="#f1f2f5" text-anchor="middle">Computer → RCForge</text><text x="795" y="529" font-size="14" fill="#a1a5b0" text-anchor="middle">Connect Arduino · USB serial</text><rect x="32" y="440" width="592" height="114" rx="12" fill="#1c2027" stroke="#3b404b"/><text x="52" y="471" font-size="18" fill="#f1f2f5" text-anchor="start">All six channels travel inside the PPM signal.</text><text x="52" y="500" font-size="15" fill="#a1a5b0" text-anchor="start">CH6 RUN still works; it does not need a sixth wire.</text><text x="52" y="527" font-size="15" fill="#eac275" text-anchor="start">PPM / iBUS / S.BUS are different protocols.</text><text x="32" y="589" font-size="15" fill="#ed938b" text-anchor="start">* Only for a bare receiver rated for 5 V within the board / USB current budget.</text><text x="32" y="616" font-size="14" fill="#a1a5b0" text-anchor="start">No ESC, BEC, separate receiver supply, motors or servos on this bench circuit.</text><text x="32" y="640" font-size="11" fill="#737c89" text-anchor="start">RCFORGE  /  VISUAL FIELD GUIDE</text></svg>
