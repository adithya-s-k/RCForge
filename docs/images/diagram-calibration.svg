<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" role="img" aria-labelledby="title desc"><title id="title">Calibrate in four passes</title><desc id="desc">Keyboard needs no calibration. For analog hardware, follow these steps in Controllers.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#b2bccb" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.controller-shell{fill:#30343b;stroke:#9ba0ab;stroke-width:1.2}.controller-well{fill:#11141a;stroke:#555d69;stroke-width:1.2}.controller-thumb{fill:#404754;stroke:#949caa}.thumb-inset{fill:#252b34;stroke:#697181}.controller-grip{fill:#222832;stroke:#48505e}.controller-outline{fill:none;stroke:#adb4bf;stroke-width:3;stroke-linecap:round}.controller-detail,.thumb-center{fill:none;stroke:#929aa8;stroke-width:1}.gimbal-guide{stroke:#69717d;stroke-width:.6}.controller-screen{fill:#141921;stroke:#858c99}.screen-lines{stroke:#82928c;stroke-width:1.5}.device-led{fill:#b5d1a3}.controller-glyph{font-size:9px;fill:#f4f4f6;text-anchor:middle}.controller-channel-label{font-size:7px;fill:#b5bac4;text-anchor:middle}.controller-caption{display:none}.keyboard-body{fill:#101319;stroke:#414956}.keyboard-key rect{fill:#1b2028;stroke:#3b4350}.keyboard-key text{text-anchor:middle}.key-letter{font-size:12px;fill:#7e8795}.key-function{font-size:7.5px;fill:#e4e9f0}.mapped .key-letter{fill:#fff}.mapped.flight rect{fill:#273e49;stroke:#7fa7b9}.mapped.power rect{fill:#4b3e29;stroke:#d1b479}.mapped.session rect{fill:#354336;stroke:#8ab193}.mapped.view rect{fill:#3f364c;stroke:#ac97c6}</style><rect width="960" height="404" rx="16" fill="#111419"/><text x="32" y="42" font-size="26" fill="#f1f2f5" text-anchor="start">Calibrate in four passes</text><text x="32" y="69" font-size="14" fill="#a1a5b0" text-anchor="start">Keyboard needs no calibration. For analog hardware, follow these steps in Controllers.</text><rect x="24" y="111" width="208" height="209" rx="12" fill="#191c22" stroke="#3b404b"/><rect x="41" y="130" width="42" height="30" rx="7" fill="#171b21" stroke="#87c8d5"/><text x="53" y="151" font-size="14" fill="#87c8d5" text-anchor="start">01</text><text x="41" y="203" font-size="27" fill="#f1f2f5" text-anchor="start">Assign</text><text x="41" y="244" font-size="14" fill="#a1a5b0" text-anchor="start">Move one axis</text><text x="41" y="281" font-size="12" fill="#f1f2f5" text-anchor="start">Detect → Reverse</text><path d="M235 216h20" fill="none" stroke="#87c8d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="259" y="111" width="208" height="209" rx="12" fill="#191c22" stroke="#3b404b"/><rect x="276" y="130" width="42" height="30" rx="7" fill="#171b21" stroke="#87c8d5"/><text x="288" y="151" font-size="14" fill="#87c8d5" text-anchor="start">02</text><text x="276" y="203" font-size="27" fill="#f1f2f5" text-anchor="start">Center</text><text x="276" y="244" font-size="14" fill="#a1a5b0" text-anchor="start">Release roll / pitch / yaw</text><text x="276" y="281" font-size="12" fill="#f1f2f5" text-anchor="start">Capture neutral</text><path d="M470 216h20" fill="none" stroke="#87c8d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="494" y="111" width="208" height="209" rx="12" fill="#191c22" stroke="#3b404b"/><rect x="511" y="130" width="42" height="30" rx="7" fill="#171b21" stroke="#87c8d5"/><text x="523" y="151" font-size="14" fill="#87c8d5" text-anchor="start">03</text><text x="511" y="203" font-size="27" fill="#f1f2f5" text-anchor="start">Sweep</text><text x="511" y="244" font-size="14" fill="#a1a5b0" text-anchor="start">Reach both endpoints</text><text x="511" y="281" font-size="12" fill="#f1f2f5" text-anchor="start">Include low / high throttle</text><path d="M705 216h20" fill="none" stroke="#87c8d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="729" y="111" width="208" height="209" rx="12" fill="#191c22" stroke="#3b404b"/><rect x="746" y="130" width="42" height="30" rx="7" fill="#171b21" stroke="#a5c6a7"/><text x="758" y="151" font-size="14" fill="#a5c6a7" text-anchor="start">04</text><text x="746" y="203" font-size="27" fill="#f1f2f5" text-anchor="start">Verify</text><text x="746" y="244" font-size="14" fill="#a1a5b0" text-anchor="start">Centers + power range</text><text x="746" y="281" font-size="12" fill="#f1f2f5" text-anchor="start">Save → test signal loss</text><text x="32" y="360" font-size="17" fill="#eac275" text-anchor="start">Reconnect makes input available. Start / resume is always a deliberate action.</text><text x="32" y="386" font-size="11" fill="#737c89" text-anchor="start">RCFORGE  /  VISUAL FIELD GUIDE</text></svg>
