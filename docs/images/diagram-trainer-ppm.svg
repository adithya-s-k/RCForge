roke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="682" y="263" font-size="22" fill="#eac275" text-anchor="start">D2</text><circle cx="510" cy="258" r="5" fill="#eac275"/><path d="M510 258v29" fill="none" stroke="#eac275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="497" y="287" width="26" height="32" rx="2" fill="#332c21" stroke="#eac275"/><text x="537" y="308" font-size="16" fill="#eac275" text-anchor="start">47 kΩ</text><path d="M510 319v21" fill="none" stroke="#b2bccb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="345" font-size="20" fill="#b2bccb" text-anchor="start">GND</text><path d="M292 340H660" fill="none" stroke="#b2bccb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="510" cy="340" r="5" fill="#b2bccb"/><text x="682" y="345" font-size="22" fill="#b2bccb" text-anchor="start">GND</text><text x="52" y="382" font-size="16" fill="#ed938b" text-anchor="start">VCC / PPM IN: unused</text><path d="M795 403v49" fill="none" stroke="#87c8d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="662" y="468" width="266" height="86" rx="12" fill="#191c22" stroke="#3b404b"/><text x="795" y="502" font-size="21" fill="#f1f2f5" text-anchor="middle">Computer → RCForge</text><text x="795" y="529" font-size="14" fill="#a1a5b0" text-anchor="middle">Connect Arduino · USB serial</text><rect x="32" y="440" width="592" height="114" rx="12" fill="#1c2027" stroke="#3b404b"/><text x="52" y="471" font-size="18" fill="#f1f2f5" text-anchor="start">Identify PPM OUT before connecting.</text><text x="52" y="500" font-size="15" fill="#a1a5b0" text-anchor="start">No guessed DIN pin numbers or wire colors.</text><text x="52" y="527" font-size="15" fill="#eac275" text-anchor="start">PPM / iBUS / S.BUS are different protocols.</text><text x="32" y="589" font-size="15" fill="#ed938b" text-anchor="start">Join signal grounds. Leave transmitter VCC disconnected.</text><text x="32" y="616" font-size="14" fill="#a1a5b0" text-anchor="start">Verify six channels, pulse levels and CH6 behavior for your radio.</text><text x="32" y="640" font-size="11" fill="#737c89" text-anchor="start">RCFORGE  /  VISUAL FIELD GUIDE</text></svg>
