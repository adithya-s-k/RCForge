<svg xmlns="http://www.w3.org/2000/svg" width="960" height="637" viewBox="0 0 960 637" role="img" aria-labelledby="title desc"><title id="title">Three rotors. Three tilt servos.</title><desc id="desc">Bronco-sized experimental layout. Geometry is reconstructed from references, not a manufacturing drawing.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#536574" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.controller-shell{fill:#30343b;stroke:#9ba0ab;stroke-width:1.2}.controller-well{fill:#11141a;stroke:#555d69;stroke-width:1.2}.controller-thumb{fill:#404754;stroke:#949caa}.thumb-inset{fill:#252b34;stroke:#697181}.controller-grip{fill:#222832;stroke:#48505e}.controller-outline{fill:none;stroke:#adb4bf;stroke-width:3;stroke-linecap:round}.controller-detail,.thumb-center{fill:none;stroke:#929aa8;stroke-width:1}.gimbal-guide{stroke:#69717d;stroke-width:.6}.controller-screen{fill:#141921;stroke:#858c99}.screen-lines{stroke:#82928c;stroke-width:1.5}.device-led{fill:#b5d1a3}.controller-glyph{font-size:9px;fill:#f4f4f6;text-anchor:middle}.controller-channel-label{font-size:7px;fill:#b5bac4;text-anchor:middle}.controller-caption{display:none}.keyboard-body{fill:#101319;stroke:#414956}.keyboard-key rect{fill:#1b2028;stroke:#3b4350}.keyboard-key text{text-anchor:middle}.key-letter{font-size:12px;fill:#7e8795}.key-function{font-size:7.5px;fill:#e4e9f0}.mapped .key-letter{fill:#fff}.mapped.flight rect{fill:#273e49;stroke:#7fa7b9}.mapped.power rect{fill:#4b3e29;stroke:#d1b479}.mapped.session rect{fill:#354336;stroke:#8ab193}.mapped.view rect{fill:#3f364c;stroke:#ac97c6}</style><rect width="960" height="637" rx="16" fill="#f7f9fb"/><text x="32" y="42" font-size="26" fill="#263442" text-anchor="start">Three rotors. Three tilt servos.</text><text x="32" y="69" font-size="14" fill="#526273" text-anchor="start">Bronco-sized experimental layout. Geometry is reconstructed from references, not a manufacturing drawing.</text><rect x="24" y="104" width="546" height="422" rx="8" fill="#edf1f5" stroke="#c8d1db"/><rect x="586" y="104" width="350" height="422" rx="8" fill="#edf1f5" stroke="#c8d1db"/><text x="44" y="133" font-size="12" fill="#526273" text-anchor="start">HOVER / TOP VIEW</text><text x="606" y="133" font-size="12" fill="#526273" text-anchor="start">REAR YAW / LOOKING FORWARD</text><g stroke="#9eabb3" stroke-width="1.5"><path d="M280 168q15-28 30 0l15 160-30 20-30-20Z" fill="#47575f"/><path d="M93 256h404v47H93Z" fill="#8e999d"/><path d="M176 245h16v206h-16Zm222 0h16v206h-16Z" fill="#6f7c83"/><path d="m184 451 111-74 111 74-8 12-103-65-103 65Z" fill="#808d93"/><path d="M290 310h10v67h-10Z" fill="#b49d73"/></g><circle cx="184" cy="220" r="48" fill="#87c8d50a" stroke="#6f9ca5" stroke-dasharray="5 5"/><path d="M142 220h84" stroke="#b3c2c9" stroke-width="7" stroke-linecap="round"/><circle cx="184" cy="220" r="5" fill="#8b5915"/><circle cx="406" cy="220" r="48" fill="#87c8d50a" stroke="#6f9ca5" stroke-dasharray="5 5"/><path d="M364 220h84" stroke="#b3c2c9" stroke-width="7" stroke-linecap="round"/><circle cx="406" cy="220" r="5" fill="#8b5915"/><circle cx="295" cy="369" r="48" fill="#87c8d50a" stroke="#6f9ca5" stroke-dasharray="5 5"/><path d="M253 369h84" stroke="#b3c2c9" stroke-width="7" stroke-linecap="round"/><circle cx="295" cy="369" r="5" fill="#8b5915"/><text x="295" y="484" font-size="16" fill="#263442" text-anchor="middle">Front pair: together, vertical → forward</text><path d="M716 226q42-37 87 0" fill="none" stroke="#8b5915" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="760" y="194" font-size="17" fill="#8b5915" text-anchor="middle">±20° yaw lean</text><path d="M668 388h185v15H668Z" fill="#ad956e" stroke="#d2bd98"/><path d="M712 383v-40h80v40" fill="none" stroke="#bd643f" stroke-width="9"/><g transform="rotate(-20 752 350)"><path d="M725 34