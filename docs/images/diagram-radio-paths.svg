<svg xmlns="http://www.w3.org/2000/svg" width="960" height="648" viewBox="0 0 960 648" role="img" aria-labelledby="title desc"><title id="title">Choose your radio connection</title><desc id="desc">All paths end in Controllers → RC transmitter. The connection button depends on the route.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#b2bccb" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.controller-shell{fill:#30343b;stroke:#9ba0ab;stroke-width:1.2}.controller-well{fill:#11141a;stroke:#555d69;stroke-width:1.2}.controller-thumb{fill:#404754;stroke:#949caa}.thumb-inset{fill:#252b34;stroke:#697181}.controller-grip{fill:#222832;stroke:#48505e}.controller-outline{fill:none;stroke:#adb4bf;stroke-width:3;stroke-linecap:round}.controller-detail,.thumb-center{fill:none;stroke:#929aa8;stroke-width:1}.gimbal-guide{stroke:#69717d;stroke-width:.6}.controller-screen{fill:#141921;stroke:#858c99}.screen-lines{stroke:#82928c;stroke-width:1.5}.device-led{fill:#b5d1a3}.controller-glyph{font-size:9px;fill:#f4f4f6;text-anchor:middle}.controller-channel-label{font-size:7px;fill:#b5bac4;text-anchor:middle}.controller-caption{display:none}.keyboard-body{fill:#101319;stroke:#414956}.keyboard-key rect{fill:#1b2028;stroke:#3b4350}.keyboard-key text{text-anchor:middle}.key-letter{font-size:12px;fill:#7e8795}.key-function{font-size:7.5px;fill:#e4e9f0}.mapped .key-letter{fill:#fff}.mapped.flight rect{fill:#273e49;stroke:#7fa7b9}.mapped.power rect{fill:#4b3e29;stroke:#d1b479}.mapped.session rect{fill:#354336;stroke:#8ab193}.mapped.view rect{fill:#3f364c;stroke:#ac97c6}</style><rect width="960" height="648" rx="16" fill="#111419"/><text x="32" y="42" font-size="26" fill="#f1f2f5" text-anchor="start">Choose your radio connection</text><text x="32" y="69" font-size="14" fill="#a1a5b0" text-anchor="start">All paths end in Controllers → RC transmitter. The connection button depends on the route.</text><rect x="32" y="112" width="42" height="30" rx="7" fill="#171b21" stroke="#87c8d5"/><text x="44" y="133" font-size="14" fill="#87c8d5" text-anchor="start">01</text><text x="95" y="133" font-size="22" fill="#f1f2f5" text-anchor="start">USB joystick adapter</text><text x="930" y="133" font-size="13" fill="#a1a5b0" text-anchor="end">No Arduino needed</text><rect x="32" y="156" width="238" height="86" rx="12" fill="#191c22" stroke="#3b404b"/><text x="151" y="190" font-size="21" fill="#f1f2f5" text-anchor="middle">FS-i6</text><text x="151" y="217" font-size="14" fill="#a1a5b0" text-anchor="middle">Trainer OUT</text><path d="M282 199h45" fill="none" stroke="#eac275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="342" y="156" width="238" height="86" rx="12" fill="#191c22" stroke="#3b404b"/><text x="461" y="190" font-size="21" fill="#f1f2f5" text-anchor="middle">USB adapter</text><text x="461" y="217" font-size="14" fill="#a1a5b0" text-anchor="middle">Joystick device</text><path d="M592 199h65" fill="none" stroke="#87c8d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="672" y="156" width="258" height="86" rx="12" fill="#191c22" stroke="#3b404b"/><text x="801" y="190" font-size="21" fill="#f1f2f5" text-anchor="middle">RCForge</text><text x="801" y="217" font-size="14" fill="#a1a5b0" text-anchor="middle">Find USB adapter</text><rect x="32" y="267" width="42" height="30" rx="7" fill="#171b21" stroke="#87c8d5"/><text x="44" y="288" font-size="14" fill="#87c8d5" text-anchor="start">02</text><text x="95" y="288" font-size="22" fill="#f1f2f5" text-anchor="start">Wireless receiver + Arduino</text><text x="930" y="288" font-size="13" fill="#a1a5b0" text-anchor="end">PPM or six PWM signals</text><rect x="32" y="311" width="238" height="86" rx="12" fill="#191c22" stroke="#3b404b"/><text x="151" y="345" font-size="21" fill="#f1f2f5" text-anchor="middle">FS-i6 → receiver</text><text x="151" y="372" font-size="14" fill="#a1a5b0" text-anchor="middle">Bound radio link</text><path d="M282 354h45" fill="none" stroke="#eac275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="342" y="311" width="238" height="86" rx="12" fill="#191c22" stroke="#3b404b"/><text x="461" y="345" font-size="21" fill="#f1f2f5" text-anchor="middle">Uno / Nano</text><text x="461" y="372" font-size="14" fill="#a1a5b0" text-anchor="middle">RCF1 serial bridge</text><path d="M592 354h65" fill="none" stroke="#87c8d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="672" y="311" width="258" height="86" rx="12" fill="#191c22" stroke="#3b404b"/><text x="801" y="345" font-size="21" fill="#f1f2f5" text-anchor="middle">RCForge</text><text x="801" y="372" font-size="14" fill="#a1a5b0" text-anchor="middle">Connect Arduino</text><rect x="32" y="422" width="42" height="30" rx="7" fill="#171b21" stroke="#87c8d5"/><text x="44" y="443" font-size="14" fill="#87c8d5" text-anchor="start">03</text><text x="95" y="443" font-size="22" fill="#f1f2f5" text-anchor="start">Trainer output + Arduino</text><text x="930" y="443" font-size="13" fill="#a1a5b0" text-anchor="end">Requires a verified PPM OUT breakout</text><rect x="32" y="466" width="238" height="86" rx="12" fill="#191c22" stroke="#3b404b"/><text x="151" y="500" font-size="21" fill="#f1f2f5" text-anchor="middle">FS-i6</text><text x="151" y="527" font-size="14" fill="#a1a5b0" text-anchor="middle">Verified trainer OUT</text><path d="M282 509h45" fill="none" stroke="#eac275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="342" y="466" width="238" height="86" rx="12" fill="#191c22" stroke="#3b404b"/><text x="461" y="500" font-size="21" fill="#f1f2f5" text-anchor="middle">Uno / Nano</text><text x="461" y="527" font-size="14" fill="#a1a5b0" text-anchor="middle">RCF1 serial bridge</text><path d="M592 509h65" fill="none" stroke="#87c8d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="672" y="466" width="258" height="86" rx="12" fill="#191c22" stroke="#3b404b"/><text x="801" y="500" font-size="21" fill="#f1f2f5" text-anchor="middle">RCForge</text><text x="801" y="527" font-size="14" fill="#a1a5b0" text-anchor="middle">Connect Arduino</text><text x="32" y="596" font-size="16" fill="#eac275" text-anchor="start">A firmware-update cable is not a USB joystick simulator adapter.</text><text x="32" y="630" font-size="11" fill="#737c89" text-anchor="start">RCFORGE  /  VISUAL FIELD GUIDE</text></svg>
