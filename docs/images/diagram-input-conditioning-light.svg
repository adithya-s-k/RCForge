<svg xmlns="http://www.w3.org/2000/svg" width="960" height="385" viewBox="0 0 960 385" role="img" aria-labelledby="title desc"><title id="title">One signal input, drawn completely</title><desc id="desc">Repeat this circuit for each PWM channel. PPM needs one circuit on D2.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#536574" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.controller-shell{fill:#30343b;stroke:#9ba0ab;stroke-width:1.2}.controller-well{fill:#11141a;stroke:#555d69;stroke-width:1.2}.controller-thumb{fill:#404754;stroke:#949caa}.thumb-inset{fill:#252b34;stroke:#697181}.controller-grip{fill:#222832;stroke:#48505e}.controller-outline{fill:none;stroke:#adb4bf;stroke-width:3;stroke-linecap:round}.controller-detail,.thumb-center{fill:none;stroke:#929aa8;stroke-width:1}.gimbal-guide{stroke:#69717d;stroke-width:.6}.controller-screen{fill:#141921;stroke:#858c99}.screen-lines{stroke:#82928c;stroke-width:1.5}.device-led{fill:#b5d1a3}.controller-glyph{font-size:9px;fill:#f4f4f6;text-anchor:middle}.controller-channel-label{font-size:7px;fill:#b5bac4;text-anchor:middle}.controller-caption{display:none}.keyboard-body{fill:#101319;stroke:#414956}.keyboard-key rect{fill:#1b2028;stroke:#3b4350}.keyboard-key text{text-anchor:middle}.key-letter{font-size:12px;fill:#7e8795}.key-function{font-size:7.5px;fill:#e4e9f0}.mapped .key-letter{fill:#fff}.mapped.flight rect{fill:#273e49;stroke:#7fa7b9}.mapped.power rect{fill:#4b3e29;stroke:#d1b479}.mapped.session rect{fill:#354336;stroke:#8ab193}.mapped.view rect{fill:#3f364c;stroke:#ac97c6}</style><rect width="960" height="385" rx="16" fill="#f7f9fb"/><text x="32" y="42" font-size="26" fill="#263442" text-anchor="start">One signal input, drawn completely</text><text x="32" y="69" font-size="14" fill="#526273" text-anchor="start">Repeat this circuit for each PWM channel. PPM needs one circuit on D2.</text><rect x="32" y="134" width="190" height="86" rx="12" fill="#edf1f5" stroke="#c2cbd5"/><text x="127" y="168" font-size="21" fill="#263442" text-anchor="middle">Source signal</text><text x="127" y="195" font-size="14" fill="#526273" text-anchor="middle">PPM OUT or PWM S</text><path d="M222 177h98" fill="none" stroke="#8b5915" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="320" y="163" width="94" height="28" rx="2" fill="#f6ecd8" stroke="#8b5915"/><text x="367" y="153" font-size="18" fill="#8b5915" text-anchor="middle">1 kΩ</text><path d="M414 177H746" fill="none" stroke="#8b5915" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="520" cy="177" r="5" fill="#8b5915"/><text x="760" y="168" font-size="21" fill="#263442" text-anchor="start">Arduino input</text><text x="760" y="195" font-size="15" fill="#526273" text-anchor="start">D2, or D3…D7</text><path d="M520 177v52" fill="none" stroke="#8b5915" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="506" y="229" width="28" height="52" rx="2" fill="#f6ecd8" stroke="#8b5915"/><text x="550" y="260" font-size="18" fill="#8b5915" text-anchor="start">47 kΩ</text><path d="M520 281v35" fill="none" stroke="#536574" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M64 316H896" fill="none" stroke="#536574" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="520" cy="316" r="5" fill="#536574"/><text x="64" y="303" font-size="16" fill="#536574" text-anchor="start">Source GND</text><text x="896" y="303" font-size="16" fill="#536574" text-anchor="end">Arduino GND</text><text x="32" y="111" font-size="15" fill="#8b5915" text-anchor="start">Logic HIGH: 3.3–5 V • LOW: near 0 V • 1 kΩ does not convert voltage.</text><text x="32" y="367" font-size="11" fill="#647283" text-anchor="start">RCFORGE  /  VISUAL FIELD GUIDE</text><style>.keyboard-body{fill:#e5ebf0;stroke:#8c9bab}.keyboard-key rect{fill:#f8fafb;stroke:#c2cbd5}.key-letter{fill:#607182}.key-function,.mapped .key-letter{fill:#263442}.mapped.flight rect{fill:#dbeaf0;stroke:#547f91}.mapped.power rect{fill:#f6ecd8;stroke:#987032}.mapped.session rect{fill:#e2ecdf;stroke:#64865e}.mapped.view rect{fill:#ebe4f3;stroke:#8b74a4}</style></svg>
