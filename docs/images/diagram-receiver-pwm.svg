ecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="524" cy="466" r="5" fill="#eac275"/><path d="M524 466v12" fill="none" stroke="#b2bccb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="514" y="478" width="20" height="16" rx="1" fill="#242a32" stroke="#b2bccb"/><path d="M524 494v7h30m-8 0h16m-13 4h10m-8 4h6" fill="none" stroke="#b2bccb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="586" y="505" font-size="12" fill="#b2bccb" text-anchor="start">47 kΩ · GND</text><text x="726" y="471" font-size="22" fill="#eac275" text-anchor="start">D6</text><text x="52" y="523" font-size="19" fill="#eac275" text-anchor="start">CH6 S</text><text x="150" y="523" font-size="14" fill="#a1a5b0" text-anchor="start">RUN guard</text><path d="M272 518H379" fill="none" stroke="#eac275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="379" y="505" width="76" height="26" rx="2" fill="#332c21" stroke="#eac275"/><text x="417" y="523" font-size="15" fill="#eac275" text-anchor="middle">1 kΩ</text><path d="M455 518H705" fill="none" stroke="#eac275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="524" cy="518" r="5" fill="#eac275"/><path d="M524 518v12" fill="none" stroke="#b2bccb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="514" y="530" width="20" height="16" rx="1" fill="#242a32" stroke="#b2bccb"/><path d="M524 546v7h30m-8 0h16m-13 4h10m-8 4h6" fill="none" stroke="#b2bccb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="586" y="557" font-size="12" fill="#b2bccb" text-anchor="start">47 kΩ · GND</text><text x="726" y="523" font-size="22" fill="#eac275" text-anchor="start">D7</text><text x="52" y="580" font-size="19" fill="#b2bccb" text-anchor="start">One − pin</text><path d="M272 575H706" fill="none" stroke="#b2bccb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="726" y="580" font-size="20" fill="#b2bccb" text-anchor="start">GND</text><text x="52" y="617" font-size="19" fill="#ed938b" text-anchor="start">One + pin</text><path d="M706 612H274" fill="none" stroke="#ed938b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="726" y="617" font-size="20" fill="#ed938b" text-anchor="start">5V *</text><text x="32" y="665" font-size="15" fill="#ed938b" text-anchor="start">* Bare receiver rated for 5 V only. No other supply, ESC, motor or servo attached.</text><text x="32" y="691" font-size="14" fill="#a1a5b0" text-anchor="start">Every pulldown returns to common GND. Leave D0 / RX and D1 / TX free for USB serial.</text><text x="32" y="717" font-size="15" fill="#87c8d5" text-anchor="start">USB data cable → computer → RCForge → Controllers → RC transmitter → Connect Arduino</text><text x="32" y="745" font-size="11" fill="#737c89" text-anchor="start">RCFORGE  /  VISUAL FIELD GUIDE</text></svg>
