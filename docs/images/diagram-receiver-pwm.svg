<svg xmlns="http://www.w3.org/2000/svg" width="960" height="763" viewBox="0 0 960 763" role="img" aria-labelledby="title desc"><title id="title">Receiver PWM → Arduino</title><desc id="desc">One wire per channel. Each input gets its own series resistor and pulldown.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#b2bccb" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.controller-shell{fill:#30343b;stroke:#9ba0ab;stroke-width:1.2}.controller-well{fill:#11141a;stroke:#555d69;stroke-width:1.2}.controller-thumb{fill:#404754;stroke:#949caa}.thumb-inset{fill:#252b34;stroke:#697181}.controller-grip{fill:#222832;stroke:#48505e}.controller-outline{fill:none;stroke:#adb4bf;stroke-width:3;stroke-linecap:round}.controller-detail,.thumb-center{fill:none;stroke:#929aa8;stroke-width:1}.gimbal-guide{stroke:#69717d;stroke-width:.6}.controller-screen{fill:#141921;stroke:#858c99}.screen-lines{stroke:#82928c;stroke-width:1.5}.device-led{fill:#b5d1a3}.controller-glyph{font-size:9px;fill:#f4f4f6;text-anchor:middle}.controller-channel-label{font-size:7px;fill:#b5bac4;text-anchor:middle}.controller-caption{display:none}.keyboard-body{fill:#101319;stroke:#414956}.keyboard-key rect{fill:#1b2028;stroke:#3b4350}.keyboard-key text{text-anchor:middle}.key-letter{font-size:12px;fill:#7e8795}.key-function{font-size:7.5px;fill:#e4e9f0}.mapped .key-letter{fill:#fff}.mapped.flight rect{fill:#273e49;stroke:#7fa7b9}.mapped.power rect{fill:#4b3e29;stroke:#d1b479}.mapped.session rect{fill:#354336;stroke:#8ab193}.mapped.view rect{fill:#3f364c;stroke:#ac97c6}</style><rect width="960" height="763" rx="16" fill="#111419"/><text x="32" y="42" font-size="26" fill="#f1f2f5" text-anchor="start">Receiver PWM → Arduino</text><text x="32" y="69" font-size="14" fill="#a1a5b0" text-anchor="start">One wire per channel. Each input gets its own series resistor and pulldown.</text><rect x="32" y="96" width="186" height="30" rx="7" fill="#171b21" stroke="#eac275"/><text x="44" y="117" font-size="14" fill="#eac275" text-anchor="start">RCF_INPUT_MODE = 2</text><text x="930" y="118" font-size="14" fill="#eac275" text-anchor="end">ALL SIX SIGNAL WIRES REQUIRED</text><rect x="32" y="149" width="240" height="482" rx="12" fill="#191c22" stroke="#3b404b"/><text x="52" y="184" font-size="21" fill="#f1f2f5" text-anchor="start">Receiver · PWM</text><text x="52" y="210" font-size="14" fill="#a1a5b0" text-anchor="start">CH1 PPM disabled</text><rect x="706" y="149" width="222" height="482" rx="12" fill="#191c22" stroke="#3b404b"/><text x="726" y="184" font-size="21" fill="#f1f2f5" text-anchor="start">Uno / Nano</text><text x="726" y="210" font-size="14" fill="#a1a5b0" text-anchor="start">Classic ATmega328P</text><text x="52" y="263" font-size="19" fill="#eac275" text-anchor="start">CH1 S</text><text x="150" y="263" font-size="14" fill="#a1a5b0" text-anchor="start">Roll</text><path d="M272 258H379" fill="none" stroke="#eac275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="379" y="245" width="76" height="26" rx="2" fill="#332c21" stroke="#eac275"/><text x="417" y="263" font-size="15" fill="#eac275" text-anchor="middle">1 kΩ</text><path d="M455 258H705" fill="none" stroke="#eac275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="524" cy="258" r="5" fill="#eac275"/><path d="M524 258v12" fill="none" stroke="#b2bccb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="514" y="270" width="20" height="16" rx="1" fill="#242a32" stroke="#b2bccb"/><path d="M524 286v7h30m-8 0h16m-13 4h10m-8 4h6" fill="none" stroke="#b2bccb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="586" y="297" font-size="12" fill="#b2bccb" text-anchor="start">47 kΩ · GND</text><text x="726" y="263" font-size="22" fill="#eac275" text-anchor="start">D2</text><text x