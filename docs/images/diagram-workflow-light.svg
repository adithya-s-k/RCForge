<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" role="img" aria-labelledby="title desc"><title id="title">From a build to a repeatable flight</title><desc id="desc">Use the same aircraft definition in the editor, simulator and command-line experiments.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#536574" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.controller-shell{fill:#30343b;stroke:#9ba0ab;stroke-width:1.2}.controller-well{fill:#11141a;stroke:#555d69;stroke-width:1.2}.controller-thumb{fill:#404754;stroke:#949caa}.thumb-inset{fill:#252b34;stroke:#697181}.controller-grip{fill:#222832;stroke:#48505e}.controller-outline{fill:none;stroke:#adb4bf;stroke-width:3;stroke-linecap:round}.controller-detail,.thumb-center{fill:none;stroke:#929aa8;stroke-width:1}.gimbal-guide{stroke:#69717d;stroke-width:.6}.controller-screen{fill:#141921;stroke:#858c99}.screen-lines{stroke:#82928c;stroke-width:1.5}.device-led{fill:#b5d1a3}.controller-glyph{font-size:9px;fill:#f4f4f6;text-anchor:middle}.controller-channel-label{font-size:7px;fill:#b5bac4;text-anchor:middle}.controller-caption{display:none}.keyboard-body{fill:#101319;stroke:#414956}.keyboard-key rect{fill:#1b2028;stroke:#3b4350}.keyboard-key text{text-anchor:middle}.key-letter{font-size:12px;fill:#7e8795}.key-function{font-size:7.5px;fill:#e4e9f0}.mapped .key-letter{fill:#fff}.mapped.flight rect{fill:#273e49;stroke:#7fa7b9}.mapped.power rect{fill:#4b3e29;stroke:#d1b479}.mapped.session rect{fill:#354336;stroke:#8ab193}.mapped.view rect{fill:#3f364c;stroke:#ac97c6}</style><rect width="960" height="404" rx="16" fill="#f7f9fb"/><text x="32" y="42" font-size="26" fill="#263442" text-anchor="start">From a build to a repeatable flight</text><text x="32" y="69" font-size="14" fill="#526273" text-anchor="start">Use the same aircraft definition in the editor, simulator and command-line experiments.</text><rect x="24" y="111" width="208" height="209" rx="12" fill="#edf1f5" stroke="#c2cbd5"/><rect x="41" y="130" width="42" height="30" rx="7" fill="#edf1f5" stroke="#236c7d"/><text x="53" y="151" font-size="14" fill="#236c7d" text-anchor="start">01</text><text x="41" y="203" font-size="27" fill="#263442" text-anchor="start">Build</text><text x="41" y="244" font-size="14" fill="#526273" text-anchor="start">Airframe + components</text><text x="41" y="281" font-size="12" fill="#263442" text-anchor="start">Weights, CG, controls</text><path d="M235 216h20" fill="none" stroke="#236c7d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="259" y="111" width="208" height="209" rx="12" fill="#edf1f5" stroke="#c2cbd5"/><rect x="276" y="130" width="42" height="30" rx="7" fill="#edf1f5" stroke="#236c7d"/><text x="288" y="151" font-size="14" fill="#236c7d" text-anchor="start">02</text><text x="276" y="203" font-size="27" fill="#263442" text-anchor="start">Check</text><text x="276" y="244" font-size="14" fill="#526273" text-anchor="start">Map input + test surfaces</text><text x="276" y="281" font-size="12" fill="#263442" text-anchor="start">Inspect direction &amp; travel</text><path d="M470 216h20" fill="none" stroke="#236c7d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="494" y="111" width="208" height="209" rx="12" fill="#edf1f5" stroke="#c2cbd5"/><rect x="511" y="130" width="42" height="30" rx="7" fill="#edf1f5" stroke="#236c7d"/><text x="523" y="151" font-size="14" fill="#236c7d" text-anchor="start">03</text><text x="511" y="203" font-size="27" fill="#263442" text-anchor="start">Fly</text><text x="511" y="244" font-size="14" fill="#526273" text-anchor="start">Choose launch + viewpoint</text><text x="511" y="281" font-size="12" fill="#263442" text-anchor="start">Pilot · Chase · FPV</text><path d="M705 216h20" fill="none" stroke="#236c7d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="729" y="111" width="208" height="209" rx="12" fill="#edf1f5" stroke="#c2cbd5"/><rect x="746" y="130" width="42" height="30" rx="7" fill="#edf1f5" stroke="#346a48"/><text x="758" y="151" font-size="14" fill="#346a48" text-anchor="start">04</text><text x="746" y="203" font-size="27" fill="#263442" text-anchor="start">Keep</text><text x="746" y="244" font-size="14" fill="#526273" text-anchor="start">Save a named version</text><text x="746" y="281" font-size="12" fill="#263442" text-anchor="start">Compare → export JSON</text><text x="32" y="360" font-size="17" fill="#8b5915" text-anchor="start">Editing the aircraft changes a local draft. Apply validates it; Export makes it portable.</text><text x="32" y="386" font-size="11" fill="#647283" text-anchor="start">RCFORGE  /  VISUAL FIELD GUIDE</text><style>.keyboard-body{fill:#e5ebf0;stroke:#8c9bab}.keyboard-key rect{fill:#f8fafb;stroke:#c2cbd5}.key-letter{fill:#607182}.key-function,.mapped .key-letter{fill:#263442}.mapped.flight rect{fill:#dbeaf0;stroke:#547f91}.mapped.power rect{fill:#f6ecd8;stroke:#987032}.mapped.session rect{fill:#e2ecdf;stroke:#64865e}.mapped.view rect{fill:#ebe4f3;stroke:#8b74a4}</style></svg>
